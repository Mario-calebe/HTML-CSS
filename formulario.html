<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camp Gamer</title>
</head>
<body>
    <header>
        <h1>Inscreva-se, Campeonato gamer, bahia região</h1>
        <hr>
    </header>
    <form action="" autocomplete="on">
        <div>
            <label for="inome">Nome do Jogador:</label>
            <input type="text" name="nome" id="inome" autocomplete="name">
        </div>

        <div>
            <label for="inick">Nickname:</label>
            <input type="text" name="nick" id="inick">
        </div>

        <div>
            <label for="isne">Crie uma senha:</label>
            <input type="password" name="senha" minlength="8" maxlength="30" required autocomplete="current-password" id="isen">
        </div>

        <div>
            <label for="idata">Data de nascimento</label>
            <input type="date" name="data" id="idata">
        </div>













    </form>

</body>
</html>
