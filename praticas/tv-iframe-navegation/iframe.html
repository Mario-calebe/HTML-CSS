<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV</title>
    <style>
        body{
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        }

        h1{
            text-align: center;
            width: 40vw;
        }

        .tv {
            width: 740px;
            height: 526px;
            background-image: url(tv.avif);
            background-size: 98% 100%;
            background-repeat: no-repeat;
            position: relative;
        }

        iframe{
            border: 3px solid black;
            position: absolute;
            left: 48%;
            top: 50%;
            transform: translate(-49%,-51%);
            width: 570px;
            height: 338px;
        }

        li{
            padding-bottom: .1rem;
        }

        .botao{
            color: black;
            background-color: slategrey;
            display: block;
            text-decoration: none;
            padding: .5rem;
            border: 1px solid black;
            width: 150px;
            text-align: center;
            border-radius: 20px;
        }
        .botao:hover{
            background-color: black;
            color: slategrey;
            transition: 0.7s;
        }
        
    </style>
</head>
<body>
    <h1>Sala</h1>
    <P>Canais disponiveis</P>
    <ul>
        <li><a target="TV" class="botao" href="https://mario-calebe.github.io/Asa-Branca/">Asa branca</a></li>
        <li><a target="TV" class="botao" href="/desafios/modulo-3/df014/notas-escola.html">Notas De Mario</a></li>

        <iframe src="" name="TV" frameborder="1"></iframe>

    </div>
