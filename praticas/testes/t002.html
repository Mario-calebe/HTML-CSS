<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>After</title>
    <style>
        h1 {
            color: transparent;
            position: relative;
            left: 0%;
            top: 0%;
        }
        h1::after {
            content: "Brasil Ordem e Progresso";
            color: black;
            position:absolute;
            left: 0;
            top: 0;
        }

        h1:hover::after {
            content: "Brasil Desordem e Regresso";
        }



    </style>
</head>
<body>
    <h1>Brasil Ordem e Progresso</h1>
</body>
</html>
