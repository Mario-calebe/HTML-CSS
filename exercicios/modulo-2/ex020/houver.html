<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Hover</title>
    <style>
        div > p {
            display: none;
            
        }
        div:hover > p {
            display: block;
            background-color: blue;
        color: tomato;
        }
         div:hover {
            color: blue;
         }
        


    </style>
</head>
<body>
    <h1>Exemplo de Hover</h1>
    <p>Passe o mouse sobre o texto abaixo e se encante</p>
    <div>
        passe o mouse aqui
        <p>TEXTO SECRETO.... <br> HELLO, WORD</p>
    </div>
    <p>FIM</p>
</body>
</html>
