<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box</title> 
    <style>
        div.container{
            background-color: antiquewhite;

            flex-flow: row wrap;
            align-items:center;
            display: flex;
            height: 1000px;
        }
            
        div.item{
            background-color: violet;
            border: 1px solid black;
            text-align: center;
            flex-basis: 150px;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="item">1</div>
        <div class="item">Contéudo maior</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">conteúdo um pouco maior</div>
        <div class="item">6</div>
        <div class="item">Conteúdo extra(ainda maior) ira ocupar mais espaço.</div>
    </div>
</body>
</html>
