<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box</title>
    <style>
        div.container{
            background-color: antiquewhite;
            display: flex;
            flex-flow: row wrap;
        }
            
        div.item{
            background-color: violet;
            border: 1px solid black;
            text-align: center;
            flex-basis: 150px;
            flex-shrink: 1;
            flex-grow: 0;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="item" style="flex-grow: 2;">2</div>
        <div class="item" style="flex-grow: 10;">3</div>
    </div>
</body>
</html>
