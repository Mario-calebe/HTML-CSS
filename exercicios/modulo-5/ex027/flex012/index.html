<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box</title>
    <style>
        div.container{
            background-color: antiquewhite;
            display: flex;
            flex-flow: row wrap;
        }
            
        div.item{
            background-color: violet;
            border: 1px solid black;
            text-align: center;
            flex-basis: 150px;
            flex-shrink: 1;
            flex-grow: 0;
        }
         #cxA{ 
            /* flex-shrink: 0;
            flex-grow: 1;
            flex-basis: 200px; */

            flex: 1 0 200px;
        } 
        #cxB{
            /* flex-shrink: 1;
            flex-grow: 1;
            flex-basis: 150px; */

            flex: 1 1 150px;
        }
        #cxC{
            /* flex-shrink:  8;
            flex-grow: 1 ;
            flex-basis: auto; */

            flex: 1 8 auto; 
        } 

    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="cxA">1</div>
        <div class="item" id="cxB">2</div>
        <div class="item" id="cxC">3</div>
    </div>
</body>
</html>
