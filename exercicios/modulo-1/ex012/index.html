<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos em HTML5</title>
</head>
<body>
    <h1>Vídeos hospedados em meu PC. Localmente</h1>
    <p>Esses vídeos estão hospedados em meu desktop no meu próprio servidor.</p>

        <video controls width="500" poster="imagens/limoes-capa.png">
            <source src="midia/meu-video.mp4" type="video/mp4">
            <source src="midia/meu-video.m4v" type="video/mp4">
            <source src="midia/Meu-Video.webm" type="video/webm">
            <p>Seu navegador não tem compatibilidade com vídeos.</p>
        </video>

        <h1>Inserindo vídeos externos do Youtube</h1>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/CISAiWac7Ck?si=yeCxsZX2AqiPEKI-" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
