<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        Body{
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }

        table {
            height: 400px;
            width: 400px;
            border-collapse: collapse;
            text-align: center;
        }      
        
        td {            
            vertical-align: bottom;
            border: 1px solid black;
        }
       
    </style>
</head>
<body>
    <h1>Minha "Primeira" Tabela</h1>
    <table>    
        <tr>
            <td class="A1">A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr>
            <td>A2</td>
            <td class="B2">B2</td>
            <td>C2</td>
        </tr>
        <tr> 
            <td>A3</td>
            <td>B3</td>
            <td class="C3">C3</td>
        </tr>
        <tr>
            <td class="A4">A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>
            </table>
</body>
</html>
