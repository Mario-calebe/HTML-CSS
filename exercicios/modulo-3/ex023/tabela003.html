<!DOCTYPE html>
<html lang="pt-bt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesclagem de Células</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
        }
        table {
            border-collapse: collapse;
            width: 300px;
            text-align: center;
        }
        td {
            border: 1px solid black;
            height: 50px; 
            

        }

    </style>
</head>
<body>
    <table>
        <tr>
            <td>A</td>    
            <td colspan="2">B</td>    
        </tr>
        <tr>
            <td rowspan="3">D</td>    
            <td>E</td>    
            <td>F</td>    
            
        </tr>
        <tr>
            <td>H</td>    
            <td>I</td>    
            
        </tr>
        <tr>
            <td>L</td>    
            <td>M</td>    

        </tr>
        
    </table>
</body>
</html>
