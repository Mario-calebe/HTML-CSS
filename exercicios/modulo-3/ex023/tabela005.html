<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicios de tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            border-collapse: collapse;
            width: 500px;
        }
        caption {
            font-size: 1.3rem;
            font-weight: bolder;

        }

        th,td{
            border: 1px solid black;
            padding: .8rem;
        }

    </style>
</head>
<body>
    <h1>Execícios de Tabelas</h1>
    <table>
        <caption>
            Cadastro
        </caption>

        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td>38</td>
            <td>Jornalista</td>
        </tr>
        <tr>    
            <td>Mário</td>
            <td>M</td>
            <td>15</td>
            <td>Estudante</td>
        </tr>
        <tr>
            <td>Gysella</td>
            <td>F</td>
            <td>15</td>
            <td>Estudante</td>
        </tr>
        <tr>
            <td>José</td>
            <td>M</td>
            <td>94</td>
            <td>Aposentado</td>
        </tr>
        <tr>
            <td>João</td>

            <td>Luffy</td>

        </tr>

    </table>
</body>
</html>
